services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerflow} -d ${POSTGRES_DB:-ledgerflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ledgerflow}:${POSTGRES_PASSWORD:-ledgerflow}@postgres:5432/${POSTGRES_DB:-ledgerflow}?sslmode=disable
      HTTP_ADDR: ":8080"
      AUTO_MIGRATE: "true"
      DEV_ENDPOINTS: ${DEV_ENDPOINTS:-true}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
